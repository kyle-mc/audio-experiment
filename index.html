<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AOE2 Build Order Audio Guides</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <header class="site-header">
    <h1>AOE2 Build Order Audio Guides</h1>
    <p class="subtitle">Pick a build, tab away, and let it call your steps as the game clock runs.</p>
  </header>

  <main>
    <section id="build-list" class="build-list" aria-label="Build orders"></section>

    <section id="player" class="player" hidden>
      <p id="player-generated-at" class="generated-at"></p>
      <div class="player-bar">
        <div class="player-bar-top">
          <button id="back-button" class="back-button" aria-label="Back to list">
            <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor" aria-hidden="true">
              <path d="M20 11H7.83l5.59-5.59L12 4l-8 8 8 8 1.41-1.41L7.83 13H20v-2z" />
            </svg>
          </button>
          <div class="player-info">
            <h2 id="player-title"></h2>
            <div class="player-controls">
              <button id="skip-back" class="skip-button" aria-label="Back 5 in-game seconds"><span class="skip-icon skip-icon-back">&#8634;</span></button>
              <button id="play-pause" class="play-pause" aria-label="Play">&#9658;</button>
              <button id="skip-forward" class="skip-button" aria-label="Forward 5 in-game seconds"><span class="skip-icon skip-icon-forward">&#8635;</span></button>
              <button id="speed-toggle" class="speed-button" aria-label="Playback speed" data-speed="1">1x</button>
              <span id="time-elapsed" class="time">0:00</span>
              <input id="scrubber" type="range" min="0" max="100" value="0" step="0.1" />
              <span id="time-total" class="time">0:00</span>
            </div>
          </div>
        </div>
        <div id="eco-tally" class="eco-tally">
          <span class="eco-item"><img class="eco-icon" src="images/wood.webp" alt="wood"><span id="eco-wood" class="eco-count">0</span></span>
          <span class="eco-item"><img class="eco-icon" src="images/food.webp" alt="food"><span id="eco-food" class="eco-count">0</span></span>
          <span class="eco-item"><img class="eco-icon" src="images/gold.webp" alt="gold"><span id="eco-gold" class="eco-count">0</span></span>
          <span class="eco-item"><img class="eco-icon" src="images/stone.webp" alt="stone"><span id="eco-stone" class="eco-count">0</span></span>
          <span id="eco-builder-item" class="eco-item" hidden><img class="eco-icon" src="images/builder.webp" alt="builder"><span id="eco-builder" class="eco-count">0</span></span>
        </div>
      </div>

      <audio id="audio-el" preload="metadata"></audio>

      <ol id="timeline" class="timeline"></ol>
    </section>
  </main>

  <script src="app.js"></script>
</body>
</html>
